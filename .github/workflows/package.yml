name: Package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack
      - name: Source archive and checksum
        run: |
          git archive --format=zip --prefix=rubycli/ -o rubycli-source.zip HEAD
          sha256sum *.tgz rubycli-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rubycli-release-files
          path: |
            *.tgz
            rubycli-source.zip
            SHA256SUMS.txt
